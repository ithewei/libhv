name: benchmark

on:
  push:
    paths-ignore:
      - '**.md'

  pull_request:
    paths-ignore:
      - '**.md'

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: prepare
        run: |
          sudo apt update
          sudo apt install libssl-dev
          sudo apt install iperf
          sudo apt install nginx

      - name: make examples
        run: |
          ./configure
          make examples

      - name: build echo-servers
        run: |
          bash echo-servers/build.sh

      - name: benchmark echo-servers
        run: |
          bash echo-servers/benchmark.sh | tee echo.log

      - name: benchmark tcp_proxy_server
        run: |
          iperf -s -p 5001 > /dev/null &
          bin/tcp_proxy_server 1212 127.0.0.1:5001 &
          for i in $(seq 50); do
            ss -ltn | grep -q ':5001 ' && ss -ltn | grep -q ':1212 ' && break
            sleep 0.1
          done
          iperf -c 127.0.0.1 -p 5001 -l 8K -y C | tee iperf_direct.csv
          iperf -c 127.0.0.1 -p 1212 -l 8K -y C | tee iperf_proxy.csv

      - name: webbench
        run: |
          sudo tee /etc/nginx/sites-available/default > /dev/null <<'EOF'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              root /var/www/html;
              index index.html;
              server_name _;
              location / {
                  try_files $uri $uri/ =404;
              }
              location = /ping {
                  default_type text/plain;
                  return 200 "pong";
              }
          }
          EOF
          sudo nginx -c /etc/nginx/nginx.conf
          sudo cp html/index.html index.html
          sudo cp html/index.html /var/www/html/index.html
          bin/httpd -c etc/httpd.conf -d
          bin/tinyhttpd 9090 &
          sleep 1
          ps aux | grep -E 'nginx|httpd' | grep -v grep
          expect() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$2")
            echo "$2 -> $code (expect $1)"
            [ "$code" = "$1" ]
          }
          for port in 80 8080 9090; do
            expect 200 http://127.0.0.1:$port/
            expect 404 http://127.0.0.1:$port/404
            expect 200 http://127.0.0.1:$port/ping
          done
          run_wrk() {
            name=$1; shift
            echo -e "\n====== $name"
            bin/wrk -c 100 -t 2 -d 10s "$@" 2>&1 | tee "wrk_$name.log"
          }
          run_wrk nginx_file     http://127.0.0.1:80/
          run_wrk httpd_file     http://127.0.0.1:8080/
          run_wrk tinyhttpd_file http://127.0.0.1:9090/
          run_wrk nginx_404      http://127.0.0.1:80/404
          run_wrk httpd_404      http://127.0.0.1:8080/404
          run_wrk tinyhttpd_404  http://127.0.0.1:9090/404
          run_wrk nginx_ping     http://127.0.0.1:80/ping
          run_wrk httpd_ping     http://127.0.0.1:8080/ping
          run_wrk tinyhttpd_ping http://127.0.0.1:9090/ping

      - name: check results
        run: |
          bash .github/scripts/benchmark_check.sh .
